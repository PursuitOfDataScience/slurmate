name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # The gate, and it runs HERE rather than being assumed from ci.yml. GitHub
  # cannot express `needs:` across workflow files, so a tag push went straight to
  # publish with no dependency on the suite at all -- and a PyPI upload cannot be
  # taken back: the version is burned whether or not the code works. This runs on
  # the tagged commit, which is the commit being shipped. Same job, same reason,
  # as nodetop's and rapidu's; those two had it and this one did not.
  gate:
    name: Lint, types & tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check src/
      - run: mypy src/
      - run: python -m pytest -q

  build-and-release:
    needs: gate
    permissions:
      id-token: write  # Required for Trusted Publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Avoid tomllib (absent on the 3.10 runner) — read the version directly.
          PKG=$(python -c "import re; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          echo "tag=$TAG  pyproject=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $PKG"
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Check package build
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
