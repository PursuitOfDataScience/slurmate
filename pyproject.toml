[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slurmate"
version = "0.7.2"
description = "Interactive TUI wizard for generating and submitting Slurm sbatch scripts"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Youzhi Yu", email = "yuyouzhi666@icloud.com"},
]
keywords = ["slurm", "sbatch", "hpc", "tui", "wizard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Topic :: Utilities",
]
dependencies = [
    "questionary>=2.0",
    "prompt_toolkit>=3.0,<4",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/PursuitOfDataScience/slurmate"
Repository = "https://github.com/PursuitOfDataScience/slurmate.git"
Issues = "https://github.com/PursuitOfDataScience/slurmate/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "pytest-cov>=4.0",
    # Both bounded on purpose, and this was the last of the five packages with
    # neither ceiling. `[tool.ruff.lint] select` names whole rule FAMILIES -- E,
    # F, I, W, UP, B, C4, SIM -- not individual codes, so every rule ruff adds to
    # any of them is opted into by a version bump alone, and `ruff check src/
    # tests/` decides whether a push is green. slurmate is also the only one of
    # the five on `mypy --strict` (see `[tool.mypy] strict = true`), which makes
    # the type checker the sharper of the two risks here: a minor release that
    # tightens one strict-mode check reddens a tree nobody touched. slurmpast's
    # pin records the sibling incident -- "a minor ruff release changing its rule
    # defaults is exactly what broke the first CI run here". Measured: CI resolves
    # ruff 0.16.6 and mypy 2.3.1 on a green run, and locally 0.15.18 / 2.1.0 leave
    # `ruff check src/ tests/` and `mypy src/` clean, so the range is verified at
    # both of its ends rather than declared.
    "ruff>=0.15,<0.17",
    "mypy>=1.8,<3",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
slurmate = "slurmate.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slurmate = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Aligned with the sibling packages, which all select these. slurmate was the
# least-linted of the five despite being the only one on `mypy --strict`: `B`
# (bugbear), `C4` (comprehensions) and `SIM` (simplify) were absent, and turning
# them on found 18 things -- a `zip()` with no `strict=`, two suppressible
# exceptions, a nested `if` that read as two separate concerns, and an `else`
# branch re-assigning the value it already held.
#
# `ARG`, `N` and `T20` are deliberately still absent: they flag 73, 9 and 59 sites
# respectively, almost all of them test doubles with unused signature arguments
# and a CLI whose job is to print. Those want per-file-ignores rather than fixes,
# and adding config to silence a rule is not the same as enforcing it.
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
# E501 is the one exemption, and it is a decision rather than an oversight -- the
# four sibling packages all enforce it and all sit at zero violations, so leaving
# this silent read as drift. Enforcing it here would flag 35 lines (28 in `src`,
# 7 in `tests`; median 108 columns). Five of them are the demo partition records
# in `system_utils.py`, 254-276 columns each, and they are one line per record on
# purpose: as a table of mock partitions they are read by scanning down a column,
# which wrapping destroys. The other 30 are 101-138 columns. `line-length = 100`
# above still governs `ruff format`, so new code is written to 100 either way --
# what is switched off is retroactively rewrapping those 35.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
